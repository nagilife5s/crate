<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0f0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crate">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Crate</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 合言葉の入力（初回だけ） -->
<div id="gate" class="gate" hidden>
  <form id="gate-form" class="gate-box" autocomplete="off">
    <img src="icons/icon-192.png" alt="" class="gate-logo">
    <h1>Crate</h1>
    <label for="gate-key">合言葉</label>
    <input id="gate-key" type="password" inputmode="text" autocapitalize="off" spellcheck="false" required>
    <p id="gate-err" class="gate-err" hidden>合言葉が違います</p>
    <button class="btn primary wide" type="submit">開く</button>
    <p class="gate-note">ホーム画面に追加して使う場合は、そちらでもう一度入力が必要です。</p>
    <p class="gate-note mock-only">モックなので、何を入れても開きます。</p>
  </form>
</div>

<div id="app" class="app">
  <header class="top">
    <div class="top-left" id="top-left"></div>
    <h1 class="top-title" id="top-title">ライブラリ</h1>
    <div class="top-right" id="top-right"></div>
  </header>

  <main id="main" class="main"></main>

  <div id="bottom" class="bottom">
    <div id="mini" class="mini" hidden></div>
    <nav class="tabs" id="tabs">
      <button data-act="tab" data-tab="library" class="tab is-on"><span class="ic" data-ic="library"></span><span>ライブラリ</span></button>
      <button data-act="tab" data-tab="playlists" class="tab"><span class="ic" data-ic="playlist"></span><span>プレイリスト</span></button>
    </nav>
  </div>
</div>

<!-- フル再生画面 -->
<section id="full" class="full" aria-hidden="true">
  <div class="full-top" id="full-top">
    <div class="grabber"></div>
    <button class="icon-btn" data-act="full-close" aria-label="閉じる"><span class="ic" data-ic="down"></span></button>
    <div class="full-src"><small>再生元</small><b id="full-src"></b></div>
    <button class="icon-btn" data-act="queue-toggle" id="queue-toggle" aria-label="キュー"><span class="ic" data-ic="queue"></span></button>
  </div>
  <div class="full-body">
    <div class="pane pane-player" id="pane-player">
      <div id="full-art" class="full-art"></div>
      <div id="full-wait" class="full-wait" hidden></div>
      <div class="full-meta">
        <div class="full-title" id="full-title"></div>
        <div class="full-artist" id="full-artist"></div>
      </div>
      <div class="seek" id="seek">
        <div class="seek-track"><div class="seek-fill" id="seek-fill"></div><div class="seek-knob" id="seek-knob"></div></div>
        <div class="seek-bubble" id="seek-bubble" hidden></div>
      </div>
      <div class="times"><span id="t-cur">0:00</span><span id="t-dur">--:--</span></div>
      <div class="controls">
        <button class="icon-btn ctl-sm" data-act="shuffle" id="btn-shuffle" aria-label="シャッフル"><span class="ic" data-ic="shuffle"></span></button>
        <button class="icon-btn ctl-md" data-act="prev" aria-label="前の曲"><span class="ic" data-ic="prev"></span></button>
        <button class="ctl-play" data-act="toggle" id="btn-play" aria-label="再生"></button>
        <button class="icon-btn ctl-md" data-act="next" aria-label="次の曲"><span class="ic" data-ic="next"></span></button>
        <button class="icon-btn ctl-sm" data-act="repeat" id="btn-repeat" aria-label="リピート"><span class="ic" data-ic="repeat"></span><i class="badge1">1</i></button>
      </div>
      <div class="full-bottom">
        <button class="icon-btn" data-act="airplay" id="btn-airplay" aria-label="AirPlay" hidden><span class="ic" data-ic="airplay"></span></button>
        <span class="kind-label" id="kind-label"></span>
        <button class="chip-btn" data-act="queue-toggle"><span class="ic" data-ic="queue"></span>キュー</button>
      </div>
    </div>
    <div class="pane pane-queue" id="pane-queue" hidden>
      <div id="queue-art" class="queue-art"></div>
      <div id="queue-list"></div>
    </div>
  </div>
</section>

<!-- YouTube の小窓（1つだけ・DOM上は動かさない） -->
<div id="yt-stage" class="yt-stage off"><div id="yt-mount"></div></div>

<div id="sheets"></div>
<div id="toasts" class="toasts"></div>

<audio id="audio" preload="auto" playsinline></audio>

<script>
  // 本番では workerUrl を入れる。空のあいだ、または ?mock=1 のときはモック（ダミーデータ）で動く。
  window.CRATE_CONFIG = { workerUrl: '' };
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
